@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1128;--fg:#ece0cb;--cd:#271a3a;--ac:#c0392f;--mu:#aa9cba;--bd:#463262;--gd:#72b0f2;--ev:#ff7a7a;--gold:#dcb65e;--ok:#5fc08a}}
:root[data-theme="dark"]{--bg:#1b1128;--fg:#ece0cb;--cd:#271a3a;--ac:#c0392f;--mu:#aa9cba;--bd:#463262;--gd:#72b0f2;--ev:#ff7a7a;--gold:#dcb65e;--ok:#5fc08a}
html{scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,"Times New Roman",serif;padding:8px 10px 96px;max-width:640px}
*{-webkit-tap-highlight-color:transparent}
h2{font:700 clamp(15px,4.7vw,20px)/1.2 var(--ff-d);margin:0;text-align:center;color:var(--gold);letter-spacing:.07em;text-transform:uppercase}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 6px;padding:4px 0 8px;border-bottom:2px solid var(--gold)}
.lg2{display:inline-block;flex:none;width:46px;height:46px;background:var(--gold);-webkit-mask:var(--lg) center/contain no-repeat;mask:var(--lg) center/contain no-repeat}.lg2.sm{width:34px;height:34px}
.hero{display:block;width:min(52vw,210px);height:auto;margin:10px auto 4px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:8px}.step b{font:700 16px var(--ff-d);letter-spacing:.08em;text-transform:uppercase}.sn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--bg);font:700 15px var(--ff-d);flex:none}
.card{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--gold);border-radius:6px;padding:12px;margin:10px 0}
button,select,input,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;margin:3px;max-width:100%;min-height:42px}
button{cursor:pointer;touch-action:manipulation}button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700;letter-spacing:.04em}button:disabled{opacity:.5}
textarea{width:100%;box-sizing:border-box}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;flex-wrap:wrap;gap:2px;padding:4px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--cd);border-top:1px solid var(--gold);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs:empty{display:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;border:0;border-top:2px solid transparent;background:none;border-radius:0;margin:0;padding:2px;min-height:50px;color:var(--mu)}
.tabs button.on{color:var(--gold);border-top-color:var(--gold);background:none}.tabs span{font-size:20px}.tabs small{font-size:11px}
.mu{color:var(--mu);font-size:14px}.g{color:var(--gd);font-weight:bold}.e{color:var(--ev);font-weight:bold}.warn{color:var(--ev);font-weight:bold}
.bn{background:var(--ac);color:#fff;padding:12px;border-radius:10px;margin:8px 0;font-weight:bold;text-align:center}
.dead{opacity:.5}.c{text-align:center}.big{font-size:26px;font-weight:bold;color:var(--gold)}
.ov{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:9;padding:20px;text-align:center;color:#fff}
.row{display:flex;flex-wrap:wrap;align-items:center}label{display:inline-block;margin:4px 10px 4px 0}
.tk img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.tk{overflow:hidden;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--gd);background:var(--bg);font-size:19px;vertical-align:middle;margin-right:6px;flex:none;}
.tk.M,.tk.D{border-color:var(--ev)}
.tk.sm{width:26px;height:26px;margin-right:4px}.tk.lg{width:96px;height:96px;font-size:52px;margin:8px auto;display:flex;border-width:3px}
.tk.back{border-color:var(--gold);color:var(--gold);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.seat{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:20px;padding:4px 12px;margin:3px;background:var(--bg)}
.seat.me{border-color:var(--gold);font-weight:bold}.seat.x{opacity:.5;text-decoration:line-through}
.qr{background:#fff;display:inline-block;padding:10px;border-radius:8px;margin:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:12px auto}.pad button{min-height:62px;font-size:26px}.dots{font-size:34px;letter-spacing:10px;color:var(--gold);min-height:46px}.bigb{width:86%;min-height:64px;font-size:20px;margin:8px 0}
.orn{text-align:center;color:var(--gold);letter-spacing:.6em;margin:2px 0 6px}
.hint{background:var(--cd);border:1px dashed var(--gold);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.toast{position:fixed;left:10px;right:10px;bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;padding:12px 14px;border-radius:10px;z-index:20;display:none;font-size:15px}
.card.good{border-left-color:var(--gd)}.card.evil{border-left-color:var(--ev)}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-top:6px}.prog i{display:block;height:100%;background:var(--gold);border-radius:3px}
.sub{color:var(--mu);font-style:italic;text-align:center;margin:0 0 6px}
details summary{cursor:pointer;min-height:32px}

.chk{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 14px 3px 3px;min-height:40px;border:2px solid var(--bd);background:var(--bg);color:var(--mu);font-size:14px;font-weight:bold;margin:0}
.chk b{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:#fff;background:transparent;flex:none}
.chk.done{border-color:#2e8b57;color:#2e8b57;background:#2e8b5722}.chk.done b{background:#2e8b57;border-color:#2e8b57}
.st{transition:.2s}.st.nx{border-left-width:6px;border-left-color:var(--gold);outline:2px solid var(--gold)}
.st.dn{border-left-color:#2e8b57;opacity:.75}.st.dn>:not(.sh){display:none}.sh{gap:6px}
.nxt{background:var(--gold);color:var(--bg);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:bold;letter-spacing:.05em}
.vclk{position:relative;width:min(100%,360px);aspect-ratio:1;margin:8px auto}
.vclk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.vr{fill:none;stroke:var(--bd);stroke-width:.6;stroke-dasharray:2 2}.vh{fill:var(--gold)}
#vhand line{stroke:var(--gold);stroke-width:1.6;stroke-linecap:round}#vhand path{fill:var(--gold)}
.vclk[data-t0="0"] #vhand{display:none}
.vs{position:absolute;transform:translate(-50%,-50%);width:58px;text-align:center;font-size:11px;line-height:1.15;padding:3px 2px;border-radius:10px;background:var(--cd);border:1px solid var(--bd);transition:.2s;word-break:break-word;box-sizing:border-box}
.vs .vi{display:block;font-size:17px}.vs small{display:block;color:var(--gold);font-size:9px}
.vs.me{border-color:var(--gold);font-weight:bold}.vs.dd{opacity:.6}.vs.tg{border-color:var(--ev);box-shadow:0 0 6px var(--ev)}
.vs.cu{background:var(--gold);color:#fff;transform:translate(-50%,-50%) scale(1.15);z-index:2}.vs.cu small{color:#fff}
.vs.ps:not(.cu){filter:grayscale(1);opacity:.55}
.cine{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;-webkit-tap-highlight-color:transparent;z-index:9999;background:#000;opacity:0;transition:opacity .5s}.cine.on{opacity:1}
.cine video{position:absolute;top:0;left:0;background:#000;width:100%;height:100%;object-fit:cover}
.cine:after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background:#0000003d}
.cine .cp{position:absolute;z-index:2;left:0;right:0;bottom:max(9%,env(safe-area-inset-bottom));text-align:center;color:#f3e6c4;padding:14px 20px;background:#000000a6;animation:cpin 1.4s .6s both}
.cine .cp b{display:block;font:bold clamp(22px,5vw,38px) Georgia,serif;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 14px #000;margin-bottom:6px}
.cine .cp span{font-size:clamp(13px,2.6vw,18px);opacity:.9;font-style:italic}
.cine .cs{position:absolute;z-index:3;top:max(14px,env(safe-area-inset-top));right:14px;margin:0;min-height:40px;padding:6px 16px;border-radius:999px;border:1px solid #f3e6c4aa;background:#000a;color:#f3e6c4;font-size:14px;opacity:0;animation:cpin .5s 1.5s forwards;cursor:pointer}
.cine .cg{position:absolute;z-index:3;top:50%;left:50%;transform:translate(-50%,-50%);margin:0;min-height:48px;padding:10px 24px;border-radius:999px;border:1px solid #f3e6c4;background:#000b;color:#f3e6c4;font-size:16px;cursor:pointer}.cine [hidden]{display:none!important}
@keyframes cpin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ic{width:1.2em;height:1.2em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.xl{width:44px;height:44px;display:block;margin:4px auto 8px;color:var(--gold)}
.sp{width:34px;height:34px;margin:10px auto;border:3px solid var(--bd);border-top-color:var(--gold);border-radius:50%;animation:spn 1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.rf input{width:80%;max-width:320px;box-sizing:border-box;margin:4px 0}.rf label{display:block;text-align:left;max-width:320px;margin:10px auto 0;font-weight:bold;font-size:14px}.rf .mu{max-width:320px;margin:4px auto}
@media(prefers-reduced-motion:reduce){.cine,.cine .cp,.cine .cs,.sp{animation-duration:.01s;transition-duration:.01s}}
.gi{color:inherit;font-style:normal;display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;vertical-align:.02em;margin-right:.1em;border:1px solid #0003}.dg{background:#2e8b57}.dw{background:#b9b2a5}.dr{background:#c0392b}.dy{background:#e0a800}

function infoText(id,i,fals){const P=S.p,others=P.map((p,k)=>k).filter(k=>k!==i);
 const num=(t,max)=>{if(!fals)return t;let x;do{x=rndi(max+1)}while(x===t);return x};

function publisherFor(topic){
 let ch=PUBCHANNELS.get(topic);
 if(!ch){ch=SB.channel(topic,{config:{broadcast:{self:false,ack:true}}});PUBCHANNELS.set(topic,ch)}
 return ch;
}
function realtimeFor(topic){
 let e=RTCHANNELS.get(topic);if(e)return e;
 if(!SB)throw new Error('Configura prima Supabase URL e Publishable Key.');
 const ch=SB.channel(topic,{config:{broadcast:{self:false,ack:true}}});
 let resolveReady;
 e={topic,ch,status:'joining',ready:new Promise(resolve=>{resolveReady=resolve}),resolveReady,handlers:new Set(),stateHandlers:new Set()};
 RTCHANNELS.set(topic,e);
 ch.on('broadcast',{event:'message'},packet=>{
  const env=packet&&packet.payload;if(!env||!env.message)return;
  const j={id:env.id||('rx-'+Date.now()+'-'+Math.random()),time:typeof env.time==='number'?env.time:Date.now()/1000};
  e.handlers.forEach(fn=>{try{fn(env.message,j)}catch(err){DIAG.err=String(err&&err.message||err)}});
 });
 ch.subscribe(status=>{
  if(status==='SUBSCRIBED'){e.status='ok';e.resolveReady(true)}
  else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')e.status=status.toLowerCase();
  else e.status='joining';
  e.stateHandlers.forEach(fn=>{try{fn()}catch(err){}});
 });
 return e;
}

function listen(topics,since,onmsg,onst){

 const update=()=>{
  if(dead)return;const all=entries.every(e=>e.status==='ok');
  const bad=entries.some(e=>['channel_error','timed_out','closed'].includes(e.status));
  const state=all?'ok':bad?'error':'joining';
  if(state!==prior){prior=state;onst(all)}
 };
 entries.forEach(e=>{e.handlers.add(receive);e.stateHandlers.add(update)});update();
 return{close:()=>{dead=true;entries.forEach(e=>{e.handlers.delete(receive);e.stateHandlers.delete(update)})}};
}

function voteClock(P,nom,me){const n=P.length;if(!n)return'';const st=nom.st!=null?nom.st:nom.by,lk=nom.lk||{};
 let h=`<div class="vclk" id="vclk" data-t0="${nom.t0||0}" data-dur="${nom.dur||5}" data-st="${st}" data-n="${n}" data-off="${nom.off||0}"><svg viewBox="-50 -50 100 100"><circle r="39" class="vr"/><circle r="2.5" class="vh"/><g id="vhand"><line y2="-30"/><path d="M-3 -27 L0 -34 L3 -27z"/></g></svg>`;
 P.forEach((p,i)=>{const a=2*Math.PI*i/n-Math.PI/2,x=50+39*Math.cos(a),y=50+39*Math.sin(a),k=(i-st+n)%n,v=lk[i];
  h+=`<div class="vs${p.al?'':' dd'}${i===me?' me':''}${i===nom.to?' tg':''}${i===nom.by?' nb':''}" data-k="${k}" style="left:${x}%;top:${y}%"><span class="vi">${v===1?'<i class="gi gi-hand"></i>':v===0?'<i class="gi gi-x"></i>':p.al?'<i class="dot dg"></i>':'<i class="gi gi-skull"></i>'}</span>${esc(p.n)}${i===nom.by?'<small>nomina</small>':i===nom.to?'<small><i class="gi gi-target"></i> nominato</small>':''}</div>`});
 return h+'</div>'}
function tickVote(){const c=document.getElementById('vclk'),hand=document.getElementById('vhand');if(!c||!hand)return;const t0=+c.dataset.t0;if(!t0)return;
 const n=+c.dataset.n,st=+c.dataset.st,f=(Date.now()-(+c.dataset.off)-t0)/(1000*(+c.dataset.dur||5)),ff=Math.max(0,Math.min(f,n));
 hand.setAttribute('transform','rotate('+(360*(st+ff-.5)/n)+')');
 c.querySelectorAll('.vs').forEach(e=>{const k=+e.dataset.k;e.classList.toggle('ps',f>=k+.5);e.classList.toggle('cu',f>=k-.5&&f<k+.5)});
 const b=document.getElementById('vbtn');if(b&&!b.dataset.dn&&f>=(+b.dataset.k)+.5){b.dataset.dn=1;b.disabled=true;b.innerHTML=b.dataset.v==='1'?'<i class="gi gi-check"></i> Voto contato':'<i class="gi gi-timer"></i> Turno passato: non puoi più votare'}}
setInterval(tickVote,100);
function startClock(){const c=S.cur,n=S.p.length;if(!c||!n)return;c.dur=+$('#vd').value||5;c.vm=$('#vm').value;c.st=c.vm==='r'?(c.to+1)%n:c.by;c.lk={};c.t0=Date.now();rc()}
function stopClock(){if(!S.cur)return;S.cur.t0=0;S.cur.lk={};rc()}
setInterval(()=>{const c=S.cur;if(!ISADM||!c||!c.t0||!S.p.length)return;const n=S.p.length,f=(Date.now()-c.t0)/(1000*(c.dur||5));c.lk=c.lk||{};let ch=false;
 for(let k=0;k<n&&f>=k+.5;k++){const i=(c.st+k)%n;if(c.lk[i]===undefined){c.lk[i]=liveV(i)?1:0;ch=true}}
 if(ch){save();sync();if(S.tab==='day')render()}},250);

const PIN='0408';let PINV='';
const ONCE={};function seenOnce(n,k){if(ONCE[n]===k)return true;ONCE[n]=k;let was=false;try{was=sessionStorage.getItem(n)===k;sessionStorage.setItem(n,k)}catch(e){}return was}
const sget=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},sset=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},sdel=k=>{try{sessionStorage.removeItem(k)}catch(e){}};
function switchRole(){try{if(DB&&DB.bye)DB.bye()}catch(e){}sdel('botcrole');sdel('botcroomok');if(location.reload)location.reload()}
function showStart(){$('#top').innerHTML='';$('#tabs').innerHTML='';$('#bn').innerHTML='';document.querySelector('h2').textContent='Blood on the Clocktower';
 $('#main').innerHTML='<div class="c"><img class="hero" src="'+LOGO1+'" alt="Blood on the Clocktower"><div class="orn">❦ ❦ ❦</div><p class="sub">Un gioco di inganni e deduzione.<br>Chi trova il Demone prima che sia troppo tardi?</p></div><div class="card c"><b>Come vuoi giocare?</b><br><button class="on bigb" onclick="pickRole(\'g\')">Giocatore</button><div class="mu">Scrivi il tuo nome e il nome della stanza, poi attendi in sala d’attesa.</div><button class="bigb" onclick="showPin()">Storyteller</button><div class="mu">Serve il PIN. Un solo Storyteller per partita.</div></div>'}
function pickRole(r){roomForm(r)}
function showPin(){PINV='';drawPin('')}
function drawPin(msg){$('#main').innerHTML=`<div class="card c"><b><i class="gi gi-lock"></i> PIN dello Storyteller</b><div class="dots">${'●'.repeat(PINV.length)+'○'.repeat(4-PINV.length)}</div><div class="warn">${msg||'&nbsp;'}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="pinKey('${d}')">${d}</button>`).join('')}<button onclick="pinKey('b')"><i class="gi gi-back"></i></button><button onclick="pinKey('0')">0</button><span></span></div><button class="bigb" onclick="showStart()">← Indietro</button></div>`}
function pinKey(k){if(k==='b'){PINV=PINV.slice(0,-1);drawPin('');return}if(PINV.length>=4)return;PINV+=k;if(PINV.length<4){drawPin('');return}if(PINV===PIN)pickRole('s');else{PINV='';drawPin('PIN errato, riprova')}}
if(document.addEventListener)document.addEventListener('keydown',e=>{if(!document.querySelector('.dots'))return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('b')});
async function boot(mode){
 const J=(location.hash.match(/j=([\w-]+)/)||[])[1];
 try{
  if(window.supabase&&SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('INSERISCI')&&SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_')&&!SUPABASE_PUBLISHABLE_KEY.includes('INSERISCI'))SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  else throw new Error('Configura SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY nel file index.html.');
  if(typeof fetch==='function'&&SB){UID=uidL();if(mode==='s'){DB=mkHost();ISADM=true}else DB=mkClient()}
 }catch(e){DIAG.err=String(e&&e.message||e);NETST='err:config';$('#top').innerHTML='';$('#tabs').innerHTML='';$('#bn').innerHTML='';$('#main').innerHTML='<div class="card"><b><i class="gi gi-gear"></i> Configurazione del collegamento</b><p>Il gioco non è ancora collegato al progetto Supabase. Apri <code>index.html</code> e inserisci URL del progetto e chiave Publishable nelle due costanti indicate all’inizio del codice di rete.</p><p class="mu">Non inserire mai una chiave Secret o service_role nel sito pubblico.</p><p class="mu">Dettaglio: '+esc(DIAG.err)+'</p><button class="bigb" onclick="switchRole()">← Indietro</button></div>';return}
 if(mode==='g'){if(!DB){$('#top').innerHTML='';$('#tabs').innerHTML='';$('#main').innerHTML='<div class="card c">Non riesco a raggiungere il servizio di connessione. Controlla internet e ricarica la pagina.<br><button class="bigb" onclick="switchRole()">← Indietro</button></div>';return}PA();return}
 render();FLUSH=renderNow;
 if(DB){const sb=(c,f)=>DB.collection(c).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());f(o)},()=>{});
  sb('lobby',o=>{LOB=o;const ch=autoNames();if(S.tab==='lobby'||(ch&&S.tab==='setup'))render()});sb('acts',o=>{ACTS=o;if(S.tab==='night')render()});sb('votes',o=>{VOTES=o;if(S.cur)sync();if(S.tab==='day')render()});sync()}
}
(()=>{const r=sget('botcrole');if((r==='s'||r==='g')&&sget('botcroomok')==='1')boot(r);else showStart()})();
</script></body></html>
