function tgAl(i){const p=S.p[i];p.al=p.al?0:1;if(!p.al&&S.phase==='night'){if(!S.nd.includes(i))S.nd.push(i)}else if(p.al)S.nd=S.nd.filter(x=>x!==i);rc()}
function msgTo(i){const t=prompt('Messaggio privato per '+S.p[i].n+':');if(!t)return;S.msgs=S.msgs||{};(S.msgs[S.p[i].uid]=S.msgs[S.p[i].uid]||[]).push({t,n:S.night});rc()}
function askTo(i,id){S.ask=S.ask||{};S.ask[S.p[i].uid]=S.night+id;rc()}
function sendTeam(){S.msgs=S.msgs||{};const ev=S.p.filter(evil),tx=ev.map(p=>p.n+' ('+p.role+')').join(', ');ev.forEach(p=>{if(p.uid)(S.msgs[p.uid]=S.msgs[p.uid]||[]).push({t:'Team malvagio: '+tx+(p.role==='Imp'?' — Bluff (non in gioco): '+S.bl.join(', '):''),n:1})});rc()}
const rndi=n=>Math.floor(Math.random()*n),pickr=a=>a[rndi(a.length)];
const actNames=a=>(Array.isArray(a.t)?a.t:[a.t]).map(i=>S.p[i]?S.p[i].n:'?').join(' + ');
function infoText(id,i,fals){const P=S.p,others=P.map((p,k)=>k).filter(k=>k!==i);
 const num=(t,max)=>{if(!fals)return t;let x;do{x=rndi(max+1)}while(x===t);return x};
 if(id==='Chef'){let c=0;for(let k=0;k<P.length;k++)if(evil(P[k])&&evil(P[(k+1)%P.length]))c++;return'Coppie di giocatori malvagi seduti vicini: '+num(c,3)}
 if(id==='Empath'){const v=nb(i).filter(j=>evil(P[j])).length;return'Dei tuoi due vicini vivi, quelli malvagi sono: '+num(v,2)}
 const type={Washerwoman:'T',Librarian:'O',Investigator:'M'}[id];
 if(type){const names=Object.keys(R).filter(r=>ty(r)===type),pool=others.filter(k=>ty(P[k].role)===type);
  if(!fals){if(!pool.length)return type==='O'?'Nessun Outsider è in gioco (0).':null;const c=pickr(pool),d=pickr(others.filter(k=>k!==c)),pr=Math.random()<.5?[c,d]:[d,c];return'Uno tra '+P[pr[0]].n+' e '+P[pr[1]].n+' è '+nm(P[c].role)}
  let r,a,b,t=0;do{r=pickr(names);a=pickr(others);b=pickr(others.filter(k=>k!==a));t++}while(t<40&&(P[a].role===r||P[b].role===r));return'Uno tra '+P[a].n+' e '+P[b].n+' è '+nm(r)}
 if(id==='Undertaker')return S.ex?'Oggi è stato giustiziato: '+nm(fals?pickr(Object.keys(R).filter(r=>r!==S.last&&ty(r)==='T')):S.last):null;
 return null}
function pushMsg(i,t){const p=S.p[i];if(!p||!p.uid)return false;S.msgs=S.msgs||{};(S.msgs[p.uid]=S.msgs[p.uid]||[]).push({t,n:S.night});return true}
function sendInfo(id,i,fals){const t=infoText(id,i,fals);if(!t){toast('Niente da inviare per questo ruolo adesso.');return}
 if(pushMsg(i,t)){rc();toast('Inviato a '+esc(S.p[i].n)+': '+esc(t))}else toast('Giocatore non collegato. Dillo a voce: '+esc(t))}
function sendFT(i,yes){const t='Risposta: '+(yes?'SÌ, uno dei due è il Demone':'NO, nessuno dei due è il Demone');if(pushMsg(i,t)){rc();toast('Inviato: '+(yes?'SÌ':'NO'))}else toast('Giocatore non collegato. Dillo a voce: '+(yes?'SÌ':'NO'))}
function sendGrim(){const P=S.p,tx=P.map(p=>p.n+': '+(p.role==='Drunk'?'Drunk (crede di essere '+nm(p.fake)+')':nm(p.role))+(p.pois?' (avvelenato)':'')+(p.rh?' (Red Herring)':'')+(p.al?'':' (morto)')).join(' | ');
 let n=0;P.forEach((p,i)=>{if(p.role==='Spy'&&pushMsg(i,'Grimorio: '+tx))n++});if(n){rc();toast('Grimorio inviato alla Spy.')}else toast('Spy non collegata: mostrale il Grimorio a voce.')}
function resendAll(){if(DB&&DB.forget)DB.forget();S.rx={};S.assignAt=Date.now();rc();toast('Ruoli reinviati ai telefoni collegati.')}
function extras(id,x0){let h='';
 if(['Chef','Empath','Washerwoman','Librarian','Investigator'].includes(id)||(id==='Undertaker'&&S.ex)){const ok=healthy(x0.p);h+=`<div class="row"><button class="${ok?'on':''}" onclick="sendInfo('${id}',${x0.i},0)"><i class="g g-mail"></i> Info vera</button><button class="${ok?'':'on'}" onclick="sendInfo('${id}',${x0.i},1)"><i class="g g-mail"></i> Info falsa</button><span class="mu">${ok?'sobrio e sano → vera':'avvelenato/ubriaco → falsa'}</span></div>`}
 if(id==='Spy')h+='<button onclick="sendGrim()"><i class="g g-mail"></i> Invia il Grimorio alla Spy</button>';
 if(id==='FortuneTeller'&&x0.p.uid){const a=ACTS[x0.p.uid];if(a&&a.k===S.night+id&&Array.isArray(a.t)){const yes=a.t.some(j=>S.p[j]&&(S.p[j].role==='Imp'||S.p[j].rh)),ok=healthy(x0.p),ans=ok?yes:!yes;h+=`<div class="hint">Ha scelto <b>${esc(actNames(a))}</b>. Risposta ${ok?'corretta':'FALSA (avvelenato/ubriaco)'}: <b>${ans?'SÌ':'NO'}</b> <span class="mu">(Recluse: decidi tu)</span> <button class="on" onclick="sendFT(${x0.i},${ans?1:0})"><i class="g g-mail"></i> Invia ${ans?'SÌ':'NO'}</button></div>`}}
 return h}
const pl=(ps,id)=>ps.filter(x=>x.p.uid).map(x=>{const a=ACTS[x.p.uid];return`<div class="mu"><i class="g g-phone"></i> ${esc(x.p.n)} <button onclick="msgTo(${x.i})"><i class="g g-mail"></i> Info</button><button onclick="askTo(${x.i},'${id}')"><i class="g g-help"></i> Chiedi scelta</button>${a&&a.k===S.night+id?' → scelta: <b>'+esc(actNames(a))+'</b>':''}</div>`}).join('');
function slayerUI(){if(!S.p.length)return'';const u=Object.keys(S.slu||{});return`<div class="card"><b><i class="g g-target"></i> Slayer (una volta per partita)</b><br><select id="sh"><option value="-1">Chi spara…</option>${opts(p=>p.al,-2)}</select><select id="sy"><option value="-1">Bersaglio…</option>${opts(p=>p.al,-2)}</select><button onclick="doSlay()">Spara</button><div class="mu">Ha effetto solo se spara il vero Slayer, sobrio e sano; per chiunque altro: “Nothing happens”. ${u.length?'Già usata da: '+u.map(esc).join(', '):''}</div></div>`}
function doSlay(){const h=+$('#sh').value,i=+$('#sy').value;if(!(h>=0)||!(i>=0)||!S.p[h]||!S.p[i])return;const sh=S.p[h],t=S.p[i];S.slu=S.slu||{};
 const isSl=sh.role==='Slayer'||(sh.role==='Drunk'&&sh.fake==='Slayer');
 if(!isSl){toast('“Nothing happens.” (chi spara non è lo Slayer: fai finta di controllare il Grimorio)');return}
 if(S.slu[sh.n]){toast('Questo Slayer ha già usato la sua abilità: “Nothing happens.”');return}
 S.slu[sh.n]=1;
 if(sh.role==='Slayer'&&healthy(sh)&&t.al&&t.role==='Imp'){toast('L’Imp muore! (non rivelare chi è morto)');kill(i,'day');return}
 if(sh.role==='Slayer'&&healthy(sh)&&t.al&&t.role==='Recluse'&&confirm('Il bersaglio è la Recluse. Registrarla come Imp (muore)?')){kill(i,'day');return}
 toast('“Nothing happens.”'+(sh.role==='Drunk'||sh.pois?' (Slayer ubriaco/avvelenato: l’abilità è comunque consumata)':''));rc()}
const voteCount=()=>S.cur?S.p.filter((p,i)=>lockV(i)).length:0;
function openVote(){const by=+$('#nb').value,to=+$('#nt').value;if(!(by>=0)||!(to>=0)){toast('Scegli prima nominatore e nominato.');return}if(S.ex){toast('Esecuzione già avvenuta oggi: nomination chiuse.');return}S.cur={by,to,id:Date.now(),t0:0,dur:5,st:by,lk:{}};rc()}
function closeVote(){const c=S.cur;if(!c)return;const b=c.by,t=c.to,x=Math.max(0,+(($('#vx')||{}).value)||0),cnt=voteCount()+x;S.p.forEach((p,i)=>{if(!p.al&&lockV(i))p.vu=1});delete FORM.vx;S.cur=null;addNom(b,t,cnt)}
function voteCard(){if(!S.cur)return'';const c=S.cur;return`<div class="card"><b><i class="g g-vote"></i> Voto aperto</b>: ${esc(S.p[c.by].n)} → ${esc(S.p[c.to].n)} · voti: <b>${voteCount()}</b>${voters().length?'<div class="mu">'+voters().map(esc).join(', ')+'</div>':''}${voteClock(S.p.map(p=>({n:p.n,al:p.al,vu:p.vu})),Object.assign({},c,{off:0}),-1)}<div class="row"><label>Secondi a giocatore <select id="vd">${[3,5,8,10,15].map(s=>`<option${s===(c.dur||5)?' selected':''}>${s}</option>`).join('')}</select></label><label>Parte da <select id="vm"><option value="n"${c.vm==='r'?'':' selected'}>nominatore</option><option value="r"${c.vm==='r'?' selected':''}>dopo il nominato (come da regolamento)</option></select></label></div><button class="on" onclick="startClock()">${c.t0?'<i class="g g-refresh"></i> Riavvia giro':'<i class="g g-play"></i> Avvia lancetta'}</button>${c.t0?'<button onclick="stopClock()"><i class="g g-stop"></i> Ferma</button>':''}<div class="mu">La lancetta ruota in senso orario: chi viene superato non può più votare. I giocatori senza app votano “a voce”: scrivi quanti sotto.</div><label>Voti a voce <input id="vx" type="number" min="0" style="width:60px"></label><button class="on" onclick="closeVote()">Chiudi e registra</button></div>`}
function useLobby(){S.uidmap={};S.names=Object.keys(LOB).map(k=>{S.uidmap[LOB[k].name]=k;return LOB[k].name}).join('\n');S.tab='setup';rc()}

function voteClock(P,nom,me){const n=P.length;if(!n)return'';const st=nom.st!=null?nom.st:nom.by,lk=nom.lk||{};
 let h=`<div class="vclk" id="vclk" data-t0="${nom.t0||0}" data-dur="${nom.dur||5}" data-st="${st}" data-n="${n}" data-off="${nom.off||0}"><svg viewBox="-50 -50 100 100"><circle r="39" class="vr"/><circle r="2.5" class="vh"/><g id="vhand"><line y2="-30"/><path d="M-3 -27 L0 -34 L3 -27z"/></g></svg>`;
 P.forEach((p,i)=>{const a=2*Math.PI*i/n-Math.PI/2,x=50+39*Math.cos(a),y=50+39*Math.sin(a),k=(i-st+n)%n,v=lk[i];
  h+=`<div class="vs${p.al?'':' dd'}${i===me?' me':''}${i===nom.to?' tg':''}${i===nom.by?' nb':''}" data-k="${k}" style="left:${x}%;top:${y}%"><span class="vi">${v===1?'<i class="g g-hand"></i>':v===0?'<i class="g g-x"></i>':p.al?'<i class="dot dg"></i>':'<i class="g g-skull"></i>'}</span>${esc(p.n)}${i===nom.by?'<small>nomina</small>':i===nom.to?'<small><i class="g g-target"></i> nominato</small>':''}</div>`});
 return h+'</div>'}
function tickVote(){const c=document.getElementById('vclk'),hand=document.getElementById('vhand');if(!c||!hand)return;const t0=+c.dataset.t0;if(!t0)return;
 const n=+c.dataset.n,st=+c.dataset.st,f=(Date.now()-(+c.dataset.off)-t0)/(1000*(+c.dataset.dur||5)),ff=Math.max(0,Math.min(f,n));
 hand.setAttribute('transform','rotate('+(360*(st+ff-.5)/n)+')');
 c.querySelectorAll('.vs').forEach(e=>{const k=+e.dataset.k;e.classList.toggle('ps',f>=k+.5);e.classList.toggle('cu',f>=k-.5&&f<k+.5)});
 const b=document.getElementById('vbtn');if(b&&!b.dataset.dn&&f>=(+b.dataset.k)+.5){b.dataset.dn=1;b.disabled=true;b.innerHTML=b.dataset.v==='1'?'<i class="g g-check"></i> Voto contato':'<i class="g g-timer"></i> Turno passato: non puoi più votare'}}
setInterval(tickVote,100);
function startClock(){const c=S.cur,n=S.p.length;if(!c||!n)return;c.dur=+$('#vd').value||5;c.vm=$('#vm').value;c.st=c.vm==='r'?(c.to+1)%n:c.by;c.lk={};c.t0=Date.now();rc()}
function stopClock(){if(!S.cur)return;S.cur.t0=0;S.cur.lk={};rc()}
setInterval(()=>{const c=S.cur;if(!ISADM||!c||!c.t0||!S.p.length)return;const n=S.p.length,f=(Date.now()-c.t0)/(1000*(c.dur||5));c.lk=c.lk||{};let ch=false;
 for(let k=0;k<n&&f>=k+.5;k++){const i=(c.st+k)%n;if(c.lk[i]===undefined){c.lk[i]=liveV(i)?1:0;ch=true}}
 if(ch){save();sync();if(S.tab==='day')render()}},250);

const PIN='0408';let PINV='';
const sget=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},sset=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},sdel=k=>{try{sessionStorage.removeItem(k)}catch(e){}};
function switchRole(){try{if(DB&&DB.bye)DB.bye()}catch(e){}sdel('botcrole');sdel('botcroomok');if(location.reload)location.reload()}
function showStart(){$('#top').innerHTML='';$('#tabs').innerHTML='';$('#bn').innerHTML='';document.querySelector('h2').textContent='Blood on the Clocktower';
 $('#main').innerHTML='<div class="c"><div class="orn">❦ ❦ ❦</div><p class="sub">Un gioco di inganni e deduzione.<br>Chi trova il Demone prima che sia troppo tardi?</p></div><div class="card c"><b>Come vuoi giocare?</b><br><button class="on bigb" onclick="pickRole(\'g\')">Giocatore</button><div class="mu">Scrivi il tuo nome e il nome della stanza, poi attendi in sala d’attesa.</div><button class="bigb" onclick="showPin()">Storyteller</button><div class="mu">Serve il PIN. Un solo Storyteller per partita.</div></div>'}
function pickRole(r){roomForm(r)}
function showPin(){PINV='';drawPin('')}
function drawPin(msg){$('#main').innerHTML=`<div class="card c"><b><i class="g g-lock"></i> PIN dello Storyteller</b><div class="dots">${'●'.repeat(PINV.length)+'○'.repeat(4-PINV.length)}</div><div class="warn">${msg||'&nbsp;'}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="pinKey('${d}')">${d}</button>`).join('')}<button onclick="pinKey('b')"><i class="g g-back"></i></button><button onclick="pinKey('0')">0</button><span></span></div><button class="bigb" onclick="showStart()">← Indietro</button></div>`}
function pinKey(k){if(k==='b'){PINV=PINV.slice(0,-1);drawPin('');return}if(PINV.length>=4)return;PINV+=k;if(PINV.length<4){drawPin('');return}if(PINV===PIN)pickRole('s');else{PINV='';drawPin('PIN errato, riprova')}}
if(document.addEventListener)document.addEventListener('keydown',e=>{if(!document.querySelector('.dots'))return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('b')});
async function boot(mode){
 const J=(location.hash.match(/j=([\w-]+)/)||[])[1];
 try{
  if(window.supabase&&SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('INSERISCI')&&SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_')&&!SUPABASE_PUBLISHABLE_KEY.includes('INSERISCI'))SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  else throw new Error('Configura SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY nel file index.html.');
  if(typeof fetch==='function'&&SB){UID=uidL();if(mode==='s'){DB=mkHost();ISADM=true}else DB=mkClient()}
 }catch(e){DIAG.err=String(e&&e.message||e);NETST='err:config';$('#top').innerHTML='';$('#tabs').innerHTML='';$('#bn').innerHTML='';$('#main').innerHTML='<div class="card"><b><i class="g g-gear"></i> Configurazione del collegamento</b><p>Il gioco non è ancora collegato al progetto Supabase. Apri <code>index.html</code> e inserisci URL del progetto e chiave Publishable nelle due costanti indicate all’inizio del codice di rete.</p><p class="mu">Non inserire mai una chiave Secret o service_role nel sito pubblico.</p><p class="mu">Dettaglio: '+esc(DIAG.err)+'</p><button class="bigb" onclick="switchRole()">← Indietro</button></div>';return}
 if(mode==='g'){if(!DB){$('#top').innerHTML='';$('#tabs').innerHTML='';$('#main').innerHTML='<div class="card c">Non riesco a raggiungere il servizio di connessione. Controlla internet e ricarica la pagina.<br><button class="bigb" onclick="switchRole()">← Indietro</button></div>';return}PA();return}
 render();FLUSH=renderNow;
 if(DB){const sb=(c,f)=>DB.collection(c).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());f(o)},()=>{});
  sb('lobby',o=>{LOB=o;const ch=autoNames();if(S.tab==='lobby'||(ch&&S.tab==='setup'))render()});sb('acts',o=>{ACTS=o;if(S.tab==='night')render()});sb('votes',o=>{VOTES=o;if(S.cur)sync();if(S.tab==='day')render()});sync()}
}
(()=>{const r=sget('botcrole');if((r==='s'||r==='g')&&sget('botcroomok')==='1')boot(r);else showStart()})();
</script></body></html>
